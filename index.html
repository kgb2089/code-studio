<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Code Studio" />
    <meta
      name="description"
      content="아이패드용 오프라인 Python & C17 코딩 · 자료구조 · 알고리즘 학습 IDE"
    />
    <title>Code Studio</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* 앱 초기 로딩 스플래시 (네이티브 앱 느낌) */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0f172a 70%);
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      #app-splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .splash-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }
      .splash-sub {
        font-size: 13px;
        color: #94a3b8;
      }
      .splash-bar {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
        overflow: hidden;
      }
      .splash-bar-inner {
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #34d399);
        animation: splashSlide 1.1s ease-in-out infinite;
      }
      @keyframes splashSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-label="Code Studio 로딩 중">
      <img src="./icons/icon.svg" alt="Code Studio" class="splash-logo" />
      <div class="splash-title">Code Studio</div>
      <div class="splash-sub" id="splash-status">Python &amp; C17 오프라인 학습 IDE</div>
      <div class="splash-bar"><div class="splash-bar-inner"></div></div>
      <div id="splash-error" style="display:none;max-width:360px;margin-top:8px;padding:10px 14px;border-radius:10px;background:rgba(244,63,94,0.16);border:1px solid rgba(244,63,94,0.45);color:#fecdd3;font-size:12px;text-align:left;word-break:break-word;white-space:pre-wrap;"></div>
    </div>
    <script>
      (function () {
        if (!Object.hasOwn) {
          Object.hasOwn = function (obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop);
          };
        }
        window.__CS_BOOT_STAGE = 'HTML 로드 완료 (JS 모듈 대기 중)';
        function showBootError(msg) {
          var box = document.getElementById('splash-error');
          var status = document.getElementById('splash-status');
          if (status) status.textContent = '앱 시작 중 문제가 발생했습니다';
          if (box) {
            box.style.display = 'block';
            box.textContent = msg;
          }
        }
        window.addEventListener('error', function (e) {
          var splash = document.getElementById('app-splash');
          if (!splash || splash.classList.contains('hidden')) return;
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var url = e.target.src || e.target.href || '';
            showBootError('리소스 로드 실패: ' + url + '\n단계: ' + window.__CS_BOOT_STAGE + '\n상세 원인 진단 중...');
            Promise.all([
              fetch(url).then(function (r) { return 'HTTP ' + r.status + ' (' + r.headers.get('content-type') + ', ACAO=' + r.headers.get('access-control-allow-origin') + ')'; }).catch(function (fe) { return 'fetch 실패: ' + (fe && fe.message ? fe.message : String(fe)); }),
              import(url).then(function () { return 'dynamic import 성공'; }).catch(function (ie) { return 'import 오류: ' + (ie && ie.name ? ie.name + ': ' : '') + (ie && ie.message ? ie.message : String(ie)); })
            ]).then(function (res) {
              showBootError(
                '리소스 로드 실패: ' + url + '\n' +
                res[0] + '\n' +
                res[1] + '\n' +
                'UA: ' + navigator.userAgent.slice(0, 100)
              );
            });
          } else {
            showBootError(((e && e.message) || '스크립트 오류') + '\n단계: ' + window.__CS_BOOT_STAGE);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var splash = document.getElementById('app-splash');
          if (splash && !splash.classList.contains('hidden')) {
            var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '초기화 오류';
            showBootError(reason + '\n단계: ' + window.__CS_BOOT_STAGE);
          }
        });
        setTimeout(function () {
          var splash = document.getElementById('app-splash');
          if (splash && !splash.classList.contains('hidden')) {
            var box = document.getElementById('splash-error');
            if (box && box.style.display === 'none') {
              var scripts = document.querySelectorAll('script[type="module"]');
              var src = scripts.length ? scripts[0].getAttribute('src') : '(없음)';
              showBootError(
                '로딩이 지연되고 있습니다.\n' +
                '현재 단계: ' + window.__CS_BOOT_STAGE + '\n' +
                '모듈 경로: ' + src + '\n' +
                'URL: ' + location.href + '\n' +
                '브라우저: ' + navigator.userAgent.slice(0, 90)
              );
            }
          }
        }, 5000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
